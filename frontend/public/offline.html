<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORCA — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #020617;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.5;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #0a192f;
        border: 1px solid #1e3a5f;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #2dd4bf;
        background: rgba(45, 212, 191, 0.1);
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 16px;
      }
      h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
      p { color: #94a3b8; font-size: 14px; margin-bottom: 8px; }
      .hint {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #1e3a5f;
        font-size: 13px;
        color: #64748b;
      }
      button {
        margin-top: 20px;
        background: #14b8a6;
        color: #020617;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #2dd4bf; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Offline</span>
      <h1>You're offline</h1>
      <p>ORCA can't reach the marine data servers right now.</p>
      <p>Some cached content may still be available on pages you visited recently.</p>
      <button onclick="location.reload()">Retry connection</button>
      <div class="hint">
        Data shown offline may be out of date. Do not rely on it for navigation or safety decisions.
      </div>
    </div>
  </body>
</html>
